[alembic]
# Migration scripts live at the repository level (database/migrations) so
# DBAs can find them alongside other database/ assets, while this config and
# env.py stay with the backend application that owns the SQLAlchemy models.
script_location = %(here)s/../database/migrations
prepend_sys_path = .
version_path_separator = os

# sqlalchemy.url is intentionally left unset here: env.py builds it at
# runtime from environment variables via app.core.config.get_settings(),
# so no connection string or credential is ever hardcoded in this file.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
